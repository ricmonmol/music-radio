<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio algorítmica — clima musical</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>"
    />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #ddd;
        max-width: 44rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .player {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
        flex-wrap: wrap;
      }
      .player button {
        flex: 0 0 auto;
        background: #1e3;
        color: #032;
        border: 0;
        border-radius: 0.4rem;
        padding: 0.7rem 1.4rem;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
      }
      .player button:hover {
        background: #2f5;
      }
      .credits {
        color: #777;
        font-size: 0.8rem;
        margin-top: 2rem;
        padding-bottom: 1.5rem;
      }
      .credits a {
        color: #7db;
        text-decoration: none;
      }
      .vol {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-left: auto;
      }
      .player .vol-btn {
        background: transparent;
        border: 1.5px solid #1e3;
        border-radius: 0.3rem;
        color: #aaa;
        font-weight: normal;
        font-size: 1.1rem;
        padding: 0.45rem 0.65rem;
        line-height: 1;
      }
      .player .vol-btn:hover {
        background: transparent;
        color: #fff;
        border-color: #2f5;
      }
      #volSlider {
        -webkit-appearance: none;
        appearance: none;
        width: 90px;
        height: 4px;
        border-radius: 2px;
        background: #444;
        outline: none;
        cursor: pointer;
      }
      #volSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #1e3;
        cursor: pointer;
      }
      #volSlider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #1e3;
        border: 0;
        cursor: pointer;
      }
      #volLabel {
        color: #777;
        font-size: 0.78rem;
        min-width: 2.2rem;
        text-align: right;
      }
      .card {
        border: 1px solid #333;
        border-radius: 0.5rem;
        padding: 1rem;
        margin: 1.5rem 0;
      }
      .card h2 {
        font-size: 1rem;
        color: #aaa;
        margin-top: 0;
      }
      #np .song {
        color: #fff;
        font-weight: 600;
        font-size: 1.05rem;
      }
      #np .album {
        color: #bbb;
        font-size: 0.9rem;
        margin-top: 0.15rem;
      }
      .attr {
        color: #999;
        font-size: 0.85rem;
        margin-top: 0.35rem;
      }
      .attr a {
        color: #7db;
      }
      .empty {
        color: #666;
        font-style: italic;
      }
      .hist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .hist li {
        padding: 0.5rem 0;
        border-top: 1px solid #262626;
      }
      .hist li:first-child {
        border-top: 0;
      }
      .hist .song {
        color: #eee;
      }
      .hist .meta {
        color: #888;
        font-size: 0.82rem;
        margin-top: 0.15rem;
      }
      .hist a {
        color: #7db;
      }
    </style>
  </head>
  <body>
    <div class="player">
      <button id="playBtn" title="Pausar">⏸️</button>
      <audio id="radio" autoplay preload="none" src="/radio"></audio>
      <div class="vol">
        <button class="vol-btn" id="muteBtn" title="Silenciar / Activar">
          🔊
        </button>
        <input type="range" id="volSlider" min="0" max="100" value="80" />
        <span id="volLabel">80%</span>
      </div>
    </div>

    <div class="card">
      <h2>Now playing</h2>
      <div id="np"><p class="empty">Sin tema aún…</p></div>
    </div>

    <div class="card">
      <h2>Historial · últimas escuchadas</h2>
      <div id="hist"><p class="empty">Cargando…</p></div>
    </div>

    <footer class="credits">
      Música libre de <a href="https://www.jamendo.com" target="_blank" rel="noopener">Jamendo</a> ·
      Hecho por <a href="https://github.com/ricmonmol" target="_blank" rel="noopener">ricmonmol</a>
    </footer>

    <script>
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      var radio = document.getElementById("radio");
      var playBtn = document.getElementById("playBtn");
      var volSlider = document.getElementById("volSlider");
      var volLabel = document.getElementById("volLabel");
      var muteBtn = document.getElementById("muteBtn");

      // Recuperar volumen guardado (default 80%)
      var savedVol = parseFloat(localStorage.getItem("radioVol") || "0.8");
      radio.volume = savedVol;
      volSlider.value = Math.round(savedVol * 100);
      volLabel.textContent = Math.round(savedVol * 100) + "%";

      function updateMuteIcon() {
        var v = radio.muted ? 0 : radio.volume;
        muteBtn.textContent = v === 0 ? "🔇" : v < 0.4 ? "🔉" : "🔊";
      }
      updateMuteIcon();

      volSlider.addEventListener("input", function () {
        var val = parseInt(this.value) / 100;
        radio.volume = val;
        radio.muted = false;
        volLabel.textContent = this.value + "%";
        localStorage.setItem("radioVol", val);
        updateMuteIcon();
      });

      muteBtn.addEventListener("click", function () {
        radio.muted = !radio.muted;
        updateMuteIcon();
        volLabel.style.visibility = radio.muted ? "hidden" : "visible";
      });

      function tick() {
        var paused = radio.paused;
        playBtn.textContent = paused ? "▶️" : "⏸️";
        playBtn.title = paused ? "Escuchar" : "Pausar";
      }
      radio.addEventListener("play", tick);
      radio.addEventListener("pause", tick);
      playBtn.addEventListener("click", function () {
        if (radio.paused) {
          radio.play().catch(function () {});
        } else {
          radio.pause();
        }
      });
      setInterval(tick, 2000);
      tick();

      async function load() {
        try {
          const np = await fetch("/now").then((r) => r.json());
          const el = document.getElementById("np");
          if (!np || !np.title) {
            el.innerHTML = '<p class="empty">Sin tema aún…</p>';
          } else {
            const att = [];
            if (np.license_url) {
              att.push(
                '<a href="' +
                  esc(np.license_url) +
                  '" target="_blank" rel="noopener">' +
                  esc((np.license || "").toUpperCase()) +
                  "</a>",
              );
            } else if (np.license) {
              att.push(esc(np.license.toUpperCase()));
            }
            if (np.track_url) {
              att.push(
                '<a href="' +
                  esc(np.track_url) +
                  '" target="_blank" rel="noopener">ver tema original</a>',
              );
            }
            el.innerHTML =
              '<div class="song">' +
              esc(np.title || "?") +
              "</div>" +
              (np.album
                ? '<div class="album">' + esc(np.album) + "</div>"
                : "") +
              '<div class="attr">' +
              esc(np.artist || "?") +
              (att.length ? " · " + att.join(" · ") : "") +
              "</div>";
          }
        } catch (e) {
          document.getElementById("np").innerHTML =
            '<p class="empty">No responde la API (/now).</p>';
        }
      }
      load();
      setInterval(load, 15000);

      async function loadHistory() {
        const el = document.getElementById("hist");
        try {
          const items = await fetch("/history?n=5").then((r) => r.json());
          if (!items || !items.length) {
            el.innerHTML = '<p class="empty">Sin historial todavía.</p>';
            return;
          }
          const lis = items
            .map(function (it) {
              const title = it.title || it.label || "?";
              const meta = [];
              const who = esc(it.artist || it.album || "");
              if (it.license) meta.push(esc(it.license.toUpperCase()));
              if (it.track_url) {
                meta.push(
                  '<a href="' +
                    esc(it.track_url) +
                    '" target="_blank" rel="noopener">fuente</a>',
                );
              }
              return (
                "<li>" +
                "<span>" +
                (it.track_url
                  ? '<a href="' +
                    esc(it.track_url) +
                    '" target="_blank" rel="noopener">' +
                    esc(title) +
                    "</a>"
                  : esc(title)) +
                "</span>" +
                (who ? '<div class="meta">' + who + "</div>" : "") +
                (meta.length
                  ? '<div class="meta">' + meta.join(" · ") + "</div>"
                  : "") +
                "</li>"
              );
            })
            .join("");
          el.innerHTML = '<ul class="hist">' + lis + "</ul>";
        } catch (e) {
          el.innerHTML = '<p class="empty">No responde la API (/history).</p>';
        }
      }
      loadHistory();
      setInterval(loadHistory, 30000);
    </script>
  </body>
</html>

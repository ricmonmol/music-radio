<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
        background: #0c0c0c;
        color: #555;
        max-width: 52rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
        font-size: 0.88rem;
        line-height: 1.7;
      }

      a { color: inherit; text-decoration: none; }
      a:hover { color: #888; }

      /* ── header ── */
      .header { color: #2a2a2a; margin-bottom: 2rem; }
      .header .dollar { color: #222; }

      /* ── box now playing ── */
      .now-box {
        border: 1px solid #1c1c1c;
        padding: 1rem 1.25rem;
        margin: 0 0 1.25rem;
        min-height: 5.5rem;
      }

      .now-artist {
        color: #888;
        letter-spacing: 0.06em;
        font-size: 0.82rem;
        margin-bottom: 0.15rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .now-tree { color: #2e2e2e; }

      .now-title {
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── volume ── */
      .vol-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1rem;
        color: #2a2a2a;
      }

      .vol-lbl { color: #252525; }

      .vol-wrap {
        position: relative;
        display: inline-block;
        cursor: pointer;
      }

      .vol-bar {
        display: block;
        letter-spacing: 0.04em;
        color: #383838;
        user-select: none;
        pointer-events: none;
      }

      #volSlider {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .vol-pct { color: #222; min-width: 2.5rem; }

      #muteBtn {
        background: none;
        border: none;
        font-family: inherit;
        font-size: inherit;
        color: #252525;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      #muteBtn:hover { color: #666; }

      /* ── play button ── */
      #playBtn {
        background: none;
        border: none;
        font-family: inherit;
        font-size: inherit;
        cursor: pointer;
        padding: 0;
        line-height: inherit;
        color: #555;
        margin-bottom: 2rem;
        display: block;
      }
      #playBtn:hover { color: #888; }
      #playBtn .arrow { color: #333; }

      /* ── history ── */
      .hist-lbl {
        color: #222;
        margin-bottom: 0.35rem;
      }

      .hist-list {
        list-style: none;
      }

      .hist-list li {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        color: #252525;
        line-height: 1.7;
      }

      .hist-tree { color: #1e1e1e; flex: 0 0 auto; }

      .hist-text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hist-link {
        color: #1e1e1e;
        text-decoration: none;
        flex: 0 0 auto;
        padding-left: 0.5rem;
      }
      .hist-link:hover { color: #666; }

      /* ── footer ── */
      footer {
        margin-top: 3rem;
        color: #1c1c1c;
        font-size: 0.78rem;
      }

      .empty { color: #222; font-style: normal; }
    </style>
  </head>
  <body>
    <div class="header"><span class="dollar">$</span> radio</div>

    <div class="now-box">
      <div class="now-artist" id="npArtist">—</div>
      <div>
        <span class="now-tree">└─ </span><span class="now-title" id="npTitle"></span>
      </div>
    </div>

    <div class="vol-row">
      <span class="vol-lbl">vol</span>
      <div class="vol-wrap">
        <span class="vol-bar" id="volBar">████████░░</span>
        <input type="range" id="volSlider" min="0" max="100" value="80" />
      </div>
      <span class="vol-pct" id="volLabel">80%</span>
      <button id="muteBtn" title="Silenciar / Activar">🔇</button>
    </div>

    <button id="playBtn">
      <span class="arrow">&gt;</span> <span id="playLabel">escuchar</span>
    </button>

    <audio id="radio" autoplay preload="none" src="/radio"></audio>

    <div class="hist-lbl">anteriores</div>
    <div id="hist"><span class="empty">—</span></div>

    <footer>
      <a href="https://www.jamendo.com" target="_blank" rel="noopener">jamendo</a> · cc ·
      <a href="https://github.com/ricmonmol" target="_blank" rel="noopener">ricmonmol</a>
    </footer>

    <script>
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      function volBar(val, total) {
        var filled = Math.round(val * total / 100);
        return "█".repeat(filled) + "░".repeat(total - filled);
      }

      var radio     = document.getElementById("radio");
      var playBtn   = document.getElementById("playBtn");
      var playLabel = document.getElementById("playLabel");
      var volSlider = document.getElementById("volSlider");
      var volLabel  = document.getElementById("volLabel");
      var volBarEl  = document.getElementById("volBar");
      var muteBtn   = document.getElementById("muteBtn");

      // Volumen guardado (default 80%)
      var savedVol = parseFloat(localStorage.getItem("radioVol") || "0.8");
      radio.volume = savedVol;
      volSlider.value = Math.round(savedVol * 100);
      volLabel.textContent = Math.round(savedVol * 100) + "%";
      volBarEl.textContent = volBar(Math.round(savedVol * 100), 10);

      function updateMuteIcon() {
        var v = radio.muted ? 0 : radio.volume;
        muteBtn.textContent = v === 0 ? "🔇" : v < 0.4 ? "🔉" : "🔊";
      }
      updateMuteIcon();

      volSlider.addEventListener("input", function () {
        var pct = parseInt(this.value);
        radio.volume = pct / 100;
        radio.muted = false;
        volLabel.textContent = pct + "%";
        volBarEl.textContent = volBar(pct, 10);
        localStorage.setItem("radioVol", pct / 100);
        updateMuteIcon();
      });

      muteBtn.addEventListener("click", function () {
        radio.muted = !radio.muted;
        updateMuteIcon();
      });

      function tick() {
        var playing = !radio.paused;
        playLabel.textContent = playing ? "pausar" : "escuchar";
      }
      radio.addEventListener("play",  tick);
      radio.addEventListener("pause", tick);
      playBtn.addEventListener("click", function () {
        if (radio.paused) { radio.play().catch(function(){}); }
        else              { radio.pause(); }
      });
      setInterval(tick, 2000);
      tick();

      // ── now playing ──────────────────────────────────────────────────
      async function load() {
        try {
          var np = await fetch("/now").then(function(r){ return r.json(); });
          var artistEl = document.getElementById("npArtist");
          var titleEl  = document.getElementById("npTitle");
          if (!np || !np.title) {
            artistEl.textContent = "—";
            titleEl.textContent  = "";
          } else {
            artistEl.textContent = (np.artist || "?").toUpperCase();
            if (np.track_url) {
              titleEl.innerHTML = '<a href="' + esc(np.track_url) + '" target="_blank" rel="noopener">' + esc(np.title) + '</a>';
            } else {
              titleEl.textContent = np.title;
            }
          }
        } catch(e) {
          document.getElementById("npArtist").textContent = "—";
          document.getElementById("npTitle").textContent  = "";
        }
      }
      load();
      setInterval(load, 15000);

      // ── historial ─────────────────────────────────────────────────────
      async function loadHistory() {
        var el = document.getElementById("hist");
        try {
          var items = await fetch("/history?n=8").then(function(r){ return r.json(); });
          if (!items || !items.length) {
            el.innerHTML = '<span class="empty">—</span>';
            return;
          }
          var lis = items.map(function(it) {
            var title  = it.title || it.label || "?";
            var artist = it.artist ? it.artist + " — " : "";
            var link   = it.track_url
              ? ' <a class="hist-link" href="' + esc(it.track_url) + '" target="_blank" rel="noopener">↗</a>'
              : '';
            return '<li>'
              + '<span class="hist-tree">└─ </span>'
              + '<span class="hist-text">' + esc(artist + title) + '</span>'
              + link
              + '</li>';
          }).join("");
          el.innerHTML = '<ul class="hist-list">' + lis + '</ul>';
        } catch(e) {
          el.innerHTML = '<span class="empty">—</span>';
        }
      }
      loadHistory();
      setInterval(loadHistory, 30000);
    </script>
  </body>
</html>

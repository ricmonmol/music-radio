<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas,
          monospace;
        background: #0c0c0c;
        color: #d4d4d4;
        max-width: 52rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
        font-size: 0.88rem;
        line-height: 1.7;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        color: #7dd3fc;
      }

      /* ── header ── */
      .header {
        color: #e5e5e5;
        margin-bottom: 1.25rem;
      }
      .header .dollar {
        color: #4ade80;
      }

      /* ── pestañas de estación ── */
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        border-bottom: 1px solid #2a2a2a;
        margin-bottom: 1.5rem;
      }

      .tab {
        background: none;
        border: 1px solid transparent;
        border-bottom: none;
        font-family: inherit;
        font-size: 0.82rem;
        color: #6b6b6b;
        cursor: pointer;
        padding: 0.3rem 0.7rem;
        margin-bottom: -1px;
        letter-spacing: 0.04em;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        line-height: 1.7;
      }
      .tab:hover {
        color: #b0b0b0;
      }
      .tab[aria-selected="true"] {
        color: #e5e5e5;
        border-color: #2a2a2a;
        background: #111;
      }
      .tab[aria-selected="true"] .tab-name {
        color: #7dd3fc;
      }

      /* ── box now playing ── */
      .now-box {
        border: 1px solid #333;
        padding: 1rem 1.25rem;
        margin: 0 0 1.25rem;
        min-height: 5.5rem;
      }

      .now-artist {
        color: #7dd3fc;
        letter-spacing: 0.06em;
        font-size: 0.82rem;
        margin-bottom: 0.15rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .now-tree {
        color: #555;
      }

      .now-title {
        color: #e5e5e5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── crédito de archivo (lugar / fecha / grabador) ── */
      .credit {
        color: #6b6b6b;
        font-size: 0.78rem;
        margin-top: 0.5rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .credit b {
        color: #8a8a8a;
        font-weight: normal;
      }

      /* ── volume ── */
      .vol-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1rem;
        color: #e5e5e5;
      }

      .vol-lbl {
        color: #b0b0b0;
      }

      .vol-wrap {
        position: relative;
        display: inline-block;
        cursor: pointer;
      }

      .vol-bar {
        display: block;
        letter-spacing: 0.04em;
        color: #979797;
        user-select: none;
        pointer-events: none;
      }

      #volSlider {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .vol-pct {
        color: #e5e5e5;
        min-width: 2.5rem;
      }

      #muteBtn {
        background: none;
        border: none;
        font-family: inherit;
        font-size: inherit;
        color: #b0b0b0;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      #muteBtn:hover {
        color: #e5e5e5;
      }

      /* ── play button ── */
      #playBtn {
        background: none;
        border: none;
        font-family: inherit;
        font-size: inherit;
        cursor: pointer;
        padding: 0;
        line-height: inherit;
        color: #d4d4d4;
        margin-bottom: 2rem;
        display: block;
      }
      #playBtn:hover {
        color: #ffffff;
      }
      #playBtn .arrow {
        color: #4ade80;
      }

      /* ── history ── */
      .hist-lbl {
        color: #e5e5e5;
        margin-bottom: 0.35rem;
      }

      .hist-list {
        list-style: none;
      }

      .hist-list li {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        color: #b0b0b0;
        line-height: 1.7;
      }

      .hist-tree {
        color: #555;
        flex: 0 0 auto;
      }

      .hist-text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hist-link {
        color: #7dd3fc;
        text-decoration: none;
        flex: 0 0 auto;
        padding-left: 0.5rem;
      }
      .hist-link:hover {
        color: #ffffff;
      }

      /* ── footer ── */
      footer {
        margin-top: 3rem;
        color: #6b6b6b;
        font-size: 0.78rem;
      }

      .foot-note {
        color: #4a4a4a;
      }

      .empty {
        color: #555;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div class="header"><span class="dollar">$</span> radio</div>

    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="now-box">
      <div class="now-artist" id="npArtist">—</div>
      <div>
        <span class="now-tree">└─ </span
        ><span class="now-title" id="npTitle"></span>
      </div>
      <div class="credit" id="npCredit"></div>
    </div>

    <div class="vol-row">
      <span class="vol-lbl">vol</span>
      <div class="vol-wrap">
        <span class="vol-bar" id="volBar">████████░░</span>
        <input type="range" id="volSlider" min="0" max="100" value="80" />
      </div>
      <span class="vol-pct" id="volLabel">80%</span>
      <button id="muteBtn" title="Mute / Unmute">🔇</button>
    </div>

    <button id="playBtn">
      <span class="arrow">&gt;</span> <span id="playLabel">listen</span>
    </button>

    <audio id="radio" autoplay preload="none" src="/radio"></audio>

    <div class="hist-lbl">previously played</div>
    <div id="hist"><span class="empty">—</span></div>

    <footer>
      <a href="https://archive.org/details/aadamjacobs" target="_blank" rel="noopener"
        >go to jacobs archive</a
      >
      ·
      <a href="https://www.jamendo.com" target="_blank" rel="noopener"
        >go to Jamendo</a
      >
      ·
      <a href="mailto:rmontecinosmolina@gmail.com">contact</a>
      · <span class="foot-note">non commercial project</span>
    </footer>

    <script>
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function volBar(val, total) {
        var filled = Math.round((val * total) / 100);
        return "█".repeat(filled) + "░".repeat(total - filled);
      }

      var radio = document.getElementById("radio");
      var playBtn = document.getElementById("playBtn");
      var playLabel = document.getElementById("playLabel");
      var volSlider = document.getElementById("volSlider");
      var volLabel = document.getElementById("volLabel");
      var volBarEl = document.getElementById("volBar");
      var muteBtn = document.getElementById("muteBtn");
      var tabsEl = document.getElementById("tabs");
      var npCredit = document.getElementById("npCredit");

      // ── estaciones ───────────────────────────────────────────────────
      var stations = [];
      var current = null;

      function stationById(id) {
        for (var i = 0; i < stations.length; i++) {
          if (stations[i].id === id) return stations[i];
        }
        return null;
      }

      function renderTabs() {
        tabsEl.innerHTML = stations
          .map(function (st) {
            var on = current && st.id === current.id;
            return (
              '<button class="tab" role="tab" data-id="' +
              esc(st.id) +
              '" aria-selected="' +
              (on ? "true" : "false") +
              '">' +
              '<span class="tab-name">' +
              esc(st.label) +
              "</span></button>"
            );
          })
          .join("");
        Array.prototype.forEach.call(
          tabsEl.querySelectorAll(".tab"),
          function (b) {
            b.addEventListener("click", function () {
              select(b.getAttribute("data-id"));
            });
          },
        );
      }

      function select(id) {
        var st = stationById(id);
        if (!st || (current && current.id === st.id)) return;
        var wasPlaying = !radio.paused;
        current = st;
        localStorage.setItem("radioStation", st.id);
        renderTabs();
        load();
        loadHistory();
        if (wasPlaying) startStream();
        else tick();
      }

      // Volumen guardado (default 80%)
      var savedVol = parseFloat(localStorage.getItem("radioVol") || "0.8");
      radio.volume = savedVol;
      volSlider.value = Math.round(savedVol * 100);
      volLabel.textContent = Math.round(savedVol * 100) + "%";
      volBarEl.textContent = volBar(Math.round(savedVol * 100), 10);

      function updateMuteIcon() {
        var v = radio.muted ? 0 : radio.volume;
        muteBtn.textContent = v === 0 ? "🔇" : v < 0.4 ? "🔉" : "🔊";
      }
      updateMuteIcon();

      volSlider.addEventListener("input", function () {
        var pct = parseInt(this.value);
        radio.volume = pct / 100;
        radio.muted = false;
        volLabel.textContent = pct + "%";
        volBarEl.textContent = volBar(pct, 10);
        localStorage.setItem("radioVol", pct / 100);
        updateMuteIcon();
      });

      muteBtn.addEventListener("click", function () {
        radio.muted = !radio.muted;
        updateMuteIcon();
      });

      function tick() {
        var playing = !radio.paused;
        playLabel.textContent = playing ? "pause" : "listen";
      }
      radio.addEventListener("play", function () {
        reconnectTry = 0;
        tick();
      });
      radio.addEventListener("pause", tick);

      // ── reconexión automática ─────────────────────────────────────────
      var userStopped = false;
      var reconnectTry = 0;
      var reconnectTimer = null;

      function scheduleReconnect() {
        if (reconnectTimer) return;
        var delay = Math.min(3000 * Math.pow(2, reconnectTry), 60000);
        if (reconnectTry < 10) reconnectTry++;
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          if (userStopped) {
            reconnectTry = 0;
            return;
          }
          startStream();
        }, delay);
      }

      radio.addEventListener("error", function () {
        if (userStopped) {
          reconnectTry = 0;
          return;
        }
        scheduleReconnect();
      });
      radio.addEventListener("ended", function () {
        if (userStopped) {
          reconnectTry = 0;
          return;
        }
        scheduleReconnect();
      });

      function stopStream() {
        userStopped = true;
        reconnectTry = 0;
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        radio.removeAttribute("src");
        radio.load();
      }
      function startStream() {
        if (!current) return;
        userStopped = false;
        radio.src = current.mount + "?t=" + Date.now();
        radio.load();
        radio.play().catch(function () {});
      }

      playBtn.addEventListener("click", function () {
        if (!radio.paused) {
          stopStream();
        } else {
          startStream();
        }
      });
      setInterval(tick, 2000);
      tick();

      // ── now playing ──────────────────────────────────────────────────
      function renderCredit(np) {
        var bits = [];
        if (np.venue) bits.push(np.venue);
        if (np.recorded) bits.push(np.recorded);
        if (np.taper) bits.push("taped by: " + np.taper);
        npCredit.textContent = bits.length ? bits.join(" · ") : "";
      }

      async function load() {
        if (!current) return;
        try {
          var np = await fetch(
            "/now?station=" + encodeURIComponent(current.id),
          ).then(function (r) {
            return r.json();
          });
          var artistEl = document.getElementById("npArtist");
          var titleEl = document.getElementById("npTitle");
          if (!np || !np.title) {
            artistEl.textContent = "—";
            titleEl.textContent = "";
            renderCredit({});
          } else {
            artistEl.textContent = (np.artist || "?").toUpperCase();
            if (np.track_url) {
              titleEl.innerHTML =
                '<a href="' +
                esc(np.track_url) +
                '" target="_blank" rel="noopener">' +
                esc(np.title) +
                "</a>";
            } else {
              titleEl.textContent = np.title;
            }
            renderCredit(np);
          }
        } catch (e) {
          document.getElementById("npArtist").textContent = "—";
          document.getElementById("npTitle").textContent = "";
          renderCredit({});
        }
      }
      setInterval(load, 15000);

      // ── historial ─────────────────────────────────────────────────────
      async function loadHistory() {
        if (!current) return;
        var el = document.getElementById("hist");
        try {
          var items = await fetch(
            "/history?station=" + encodeURIComponent(current.id) + "&n=8",
          ).then(function (r) {
            return r.json();
          });
          if (!items || !items.length) {
            el.innerHTML = '<span class="empty">—</span>';
            return;
          }
          var lis = items
            .map(function (it) {
              var title = it.title || it.label || "?";
              var artist = it.artist ? it.artist + " — " : "";
              var text = esc(artist + title);
              var inner = it.track_url
                ? '<a class="hist-link" href="' + esc(it.track_url) + '" target="_blank" rel="noopener">' + text + "</a>"
                : text;
              return (
                "<li>" +
                '<span class="hist-tree">└─ </span>' +
                '<span class="hist-text">' +
                inner +
                "</span>" +
                "</li>"
              );
            })
            .join("");
          el.innerHTML = '<ul class="hist-list">' + lis + "</ul>";
        } catch (e) {
          el.innerHTML = '<span class="empty">—</span>';
        }
      }
      setInterval(loadHistory, 30000);

      // ── arranque ──────────────────────────────────────────────────────
      (async function boot() {
        var doc = { default: null, stations: [] };
        try {
          doc = await fetch("/stations").then(function (r) {
            return r.json();
          });
        } catch (e) {
          /* no config: panel stays blank but doesn't break */
        }
        stations = doc.stations || [];
        var saved = localStorage.getItem("radioStation");
        current =
          stationById(saved) || stationById(doc.default) || stations[0] || null;
        if (!current) return;
        renderTabs();
        load();
        loadHistory();
        // El <audio> arranca con src="/radio" hardcodeado; se realinea con la
        // estación elegida para no quedar sonando la otra.
        if (!radio.paused) startStream();
        else radio.src = current.mount;
      })();
    </script>
  </body>
</html>
